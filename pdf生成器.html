                            <!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>拖图排序 & 预览 & 生成PDF（等比不变形）</title>
  <style>
    :root {
      --gap: 12px;
      --thumb-size: 160px; /* 缩略图外框大小（预览是低清） */
      --border: 2px;
    }
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial; margin: 0; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .btn {
      padding: 10px 14px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .btn.primary { background: #111; color: #fff; border-color: #111; }
    .dropzone {
      border: 2px dashed #bbb; border-radius: 12px; padding: 18px; text-align: center; color: #666; margin-bottom: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--thumb-size), 1fr));
      gap: var(--gap);
    }
    .card {
      position: relative; border: var(--border) solid #e5e7eb; border-radius: 14px;
      background: #fafafa; overflow: hidden; user-select: none;
    }
    .thumb {
      width: 100%; height: var(--thumb-size); object-fit: cover; display: block; background: #eee;
    }
    .card .idx {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px;
      padding: 2px 6px; border-radius: 8px;
    }
    .card .actions {
      position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px;
    }
    .mini-btn {
      font-size: 12px; padding: 6px 8px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .dragging { opacity: .6; outline: 2px dashed #3b82f6; }
    .placeholder { outline: 2px dashed #9ca3af; }

    /* 预览大图的 Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.78); display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .lightbox.active { display: flex; }
    .lightbox-inner {
      max-width: 92vw; max-height: 92vh; position: relative; display: flex; flex-direction: column; gap: 10px; align-items: center;
    }
    .lightbox img { max-width: 92vw; max-height: 80vh; object-fit: contain; background: #111; }
    .lightbox .lb-actions { display: flex; gap: 10px; }
    .hint { color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <h1>拖图排序 & 预览 & 生成PDF</h1>

  <div class="toolbar">
    <button class="btn" id="pickBtn">选择图片</button>
    <input type="file" id="fileInput" accept="image/*" multiple hidden />
    <input type="text" id="pdfNameInput" placeholder="输入文件名" class="btn" />
    <button class="btn primary" id="genPdfBtn">生成 PDF（等比）</button>
    <span class="hint">提示：可拖入多张图片；缩略图是低清，点击看大图。</span>
  </div>

  <div id="dropzone" class="dropzone">
    将图片拖到这里，或点击“选择图片”
  </div>

  <div id="grid" class="grid"></div>

  <!-- 大图预览 Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-inner" role="dialog" aria-modal="true">
      <img id="lightboxImg" alt="预览大图"/>
      <div class="lb-actions">
        <button class="btn" id="lbBack">返回</button>
        <a class="btn" id="lbDownload" download>下载原图</a>
      </div>
    </div>
  </div>

  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const { jsPDF } = window.jspdf;

    /** 数据结构：每张图片保存原图与缩略图 */
    const images = []; // { id, originalUrl, previewUrl, w, h, type }
    let dragSrcId = null;

    /** 工具：生成低清缩略图（用于列表排序显示） */
    function makePreview(dataUrl, maxSide = 400, quality = 0.6) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const { width, height } = img;
          const scale = Math.min(1, maxSide / Math.max(width, height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(width * scale);
          canvas.height = Math.round(height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // 按原类型导出（png 不压 jpeg，透明保留；jpeg压缩）
          const mime = dataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';
          const out = canvas.toDataURL(mime, mime === 'image/jpeg' ? quality : 1.0);
          resolve(out);
        };
        img.src = dataUrl;
      });
    }

    /** 读取 File -> dataURL，并记录原始尺寸 */
    function fileToDataUrlWithSize(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          const img = new Image();
          img.onload = () => {
            resolve({ dataUrl, w: img.naturalWidth, h: img.naturalHeight });
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      });
    }

    /** 渲染缩略图网格 */
    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      images.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.draggable = true;
        card.dataset.id = item.id;

        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = item.previewUrl;
        img.alt = `图片 ${idx+1}`;
        img.addEventListener('click', () => openLightbox(item));

        const idxTag = document.createElement('div');
        idxTag.className = 'idx';
        idxTag.textContent = idx + 1;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const viewBtn = document.createElement('button');
        viewBtn.className = 'mini-btn';
        viewBtn.textContent = '查看';
        viewBtn.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(item); });

        const delBtn = document.createElement('button');
        delBtn.className = 'mini-btn';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const i = images.findIndex(x => x.id === item.id);
          if (i >= 0) { images.splice(i, 1); renderGrid(); }
        });

        actions.appendChild(viewBtn);
        actions.appendChild(delBtn);

        card.appendChild(img);
        card.appendChild(idxTag);
        card.appendChild(actions);

        // 拖拽排序（原生 DnD）
        card.addEventListener('dragstart', (e) => {
          dragSrcId = item.id;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => { card.classList.remove('dragging'); });
        card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('placeholder'); });
        card.addEventListener('dragleave', () => { card.classList.remove('placeholder'); });
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('placeholder');
          if (!dragSrcId || dragSrcId === item.id) return;
          const from = images.findIndex(x => x.id === dragSrcId);
          const to = images.findIndex(x => x.id === item.id);
          if (from >= 0 && to >= 0) {
            const [moved] = images.splice(from, 1);
            images.splice(to, 0, moved);
            renderGrid();
          }
          dragSrcId = null;
        });

        grid.appendChild(card);
      });
    }

    /** 打开/关闭大图预览 Lightbox */
    function openLightbox(item) {
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      const dl = document.getElementById('lbDownload');
      img.src = item.originalUrl;
      dl.href = item.originalUrl;
      dl.download = `image_${item.id}.${item.type === 'PNG' ? 'png' : 'jpg'}`;
      lb.classList.add('active');
      lb.setAttribute('aria-hidden', 'false');
    }
    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('active');
      lb.setAttribute('aria-hidden', 'true');
      document.getElementById('lightboxImg').src = '';
    }

    /** 生成 PDF：等比缩放，自动横/竖向 */
    async function generatePDF() {
      if (!images.length) { alert('请先添加图片'); return; }

      // 获取自定义文件名
      const fileName = document.getElementById('pdfNameInput').value.trim() || 'images';

      const doc = new jsPDF({ unit: 'mm', format: 'a4' });

      images.forEach((item, i) => {
        // 计算页面尺寸
        const pageWidth = doc.internal.pageSize.width;
        const pageHeight = doc.internal.pageSize.height;
        const margin = 10;
        const maxWidth = pageWidth - 2 * margin;
        const maxHeight = pageHeight - 2 * margin;

        // 计算图片缩放比例（按宽或高等比缩放）
        const scale = Math.min(maxWidth / item.w, maxHeight / item.h);
        const width = item.w * scale;
        const height = item.h * scale;

        // 图片居中位置
        const x = (pageWidth - width) / 2;
        const y = (pageHeight - height) / 2;

        if (i > 0) doc.addPage();
        doc.addImage(item.originalUrl, item.type === 'PNG' ? 'PNG' : 'JPEG', x, y, width, height);
      });

      // 下载 PDF
      doc.save(`${fileName}.pdf`);
    }

    /** 处理文件列表 */
    async function handleFiles(fileList) {
      const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
      if (!files.length) return;
      for (const f of files) {
        const { dataUrl, w, h } = await fileToDataUrlWithSize(f);
        const previewUrl = await makePreview(dataUrl, 400, 0.6); // 低清缩略
        const type = dataUrl.startsWith('data:image/png') ? 'PNG' : 'JPEG';
        images.push({ id: crypto.randomUUID(), originalUrl: dataUrl, previewUrl, w, h, type });
      }
      renderGrid();
    }

    /** 拖拽 & 选择 */
    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.background = '#f5f5f5'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.background = ''; });
    dropzone.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropzone.style.background = '';
      await handleFiles(e.dataTransfer.files);
    });

    document.getElementById('pickBtn').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      await handleFiles(e.target.files);
      e.target.value = ''; // 允许重复选择同一文件
    });

    document.getElementById('genPdfBtn').addEventListener('click', generatePDF);

    // Lightbox 交互
    document.getElementById('lbBack').addEventListener('click', closeLightbox);
    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox(); // 点击遮罩关闭
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
